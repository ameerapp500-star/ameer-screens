
name: Build Ameer Screens APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p build-project
          unzip -q ameer-screens-starter.zip -d build-project

          SETTINGS=$(find build-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings not found"
            find build-project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Diagnose AndroidManifest XML
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            find "$PROJECT_DIR" -name AndroidManifest.xml
            exit 1
          fi

          echo "Checking: $MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              ET.parse(path)
              print("SUCCESS: Manifest XML syntax is valid")
          except ET.ParseError as e:
              print("MANIFEST XML ERROR:", e)
              line, col = e.position
              print("Line:", line, "Column:", col)

              with open(path, encoding="utf-8", errors="replace") as f:
                  lines = f.readlines()

              if 0 < line <= len(lines):
                  print("Problem line:", repr(lines[line - 1]))

              sys.exit(1)
          PY

      - name: Configure JVM 17
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Create Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ameer-screens-debug-apk
          path: build-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
