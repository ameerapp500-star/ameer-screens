
name: Build Ameer Screens APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enter Android project
        run: |
          cd build-src/ameer-screens-starter
          pwd
          ls

      - name: Create Gradle Wrapper
        working-directory: build-src/ameer-screens-starter
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Build APK
        working-directory: build-src/ameer-screens-starter
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ameer-screens-debug-apk
          path: build-src/ameer-screens-starter/app/build/outputs/apk/debug/app-debug.apk
