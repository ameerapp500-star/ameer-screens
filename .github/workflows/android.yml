
name: Build Ameer Screens APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repair Gradle file path
        run: |
          if [ -d "app/build.gradle.kts" ] && [ -f "app/build.gradle.kts/build.gradle.kts" ]; then
            cp "app/build.gradle.kts/build.gradle.kts" /tmp/ameer-build.gradle.kts
            rm -rf "app/build.gradle.kts"
            mv /tmp/ameer-build.gradle.kts "app/build.gradle.kts"
          fi

      - name: Validate project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/ameerscreens/app/MainActivity.kt

      - name: Validate Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml')"

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ameer-screens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
