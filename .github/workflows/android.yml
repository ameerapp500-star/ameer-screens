
name: AMEER SCREENS APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -q ameer-screens-starter.zip -d build-src

      - name: Locate project
        run: |
          PROJECT_FILE=$(find build-src -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          cat > /tmp/ameer-jvm17.init.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          EOF

          if [ ! -f "./gradlew" ]; then
            echo "Creating Gradle Wrapper..."
            gradle wrapper
          fi

          chmod +x ./gradlew

          ./gradlew -I /tmp/ameer-jvm17.init.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMEER-SCREENS-APK
          path: build-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
