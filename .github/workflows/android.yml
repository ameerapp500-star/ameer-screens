
name: AMEER SCREENS APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p build-src
          unzip -q ameer-screens-starter.zip -d build-src

      - name: Locate project
        run: |
          PROJECT_FILE=$(find build-src -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Project settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Fix Java Kotlin and LayoutDirection
        run: |
          cd "$PROJECT_DIR"

          MAIN_ACTIVITY=$(find app/src/main -name MainActivity.kt -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.kt not found"
            exit 1
          fi

          if ! grep -q "import androidx.compose.ui.unit.LayoutDirection" "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import androidx.compose.ui.unit.LayoutDirection' "$MAIN_ACTIVITY"
          fi

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMEER-SCREENS-APK
          path: build-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
