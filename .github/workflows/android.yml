
name: AMEER SCREENS APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract starter project
        run: |
          mkdir -p build-src
          unzip -q ameer-screens-starter.zip -d build-src

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find build-src -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project files were not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMEER-SCREENS-APK
          path: build-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
