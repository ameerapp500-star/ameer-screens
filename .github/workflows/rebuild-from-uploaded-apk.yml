name: Rebuild Ameer Screens from uploaded APK

on:
  push:
    paths:
      - ".github/workflows/rebuild-from-uploaded-apk.yml"
    branches:
      - rebuild-from-uploaded-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download the decompilation of the exact uploaded APK
        uses: actions/download-artifact@v4
        with:
          name: ameer-apk-decompiled
          path: extracted
          repository: ameerapp500-star/ameer-screens
          run-id: 45276581730
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack decompiled app files
        run: |
          set -euo pipefail
          unzip -q extracted/ameer-apk-decompiled.zip -d decoded
          mv decoded/output/decompiled decoded/app
          test -f decoded/app/resources/AndroidManifest.xml
          test -d decoded/app/sources/com/carscreens/app

      - name: Create a clean Android Gradle project
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main
          cp decoded/app/resources/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          mkdir -p project/app/src/main/res/drawable project/app/src/main/res/xml
          cp decoded/app/resources/res/drawable/ic_launcher.png project/app/src/main/res/drawable/
          cp decoded/app/resources/res/xml/automotive_app_desc.xml project/app/src/main/res/xml/
          mkdir -p project/app/src/main/assets
          cp -R decoded/app/resources/assets/. project/app/src/main/assets/
          mkdir -p project/app/src/main/java/com/carscreens/app
          find decoded/app/sources/com/carscreens/app -maxdepth 1 -name '*.java' ! -name 'R.java' -exec cp {} project/app/src/main/java/com/carscreens/app/ \;
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/carscreens/app/AutoService.java")
          s = p.read_text()
          s = s.replace("this.f$0.lambda$play$0(mediaPlayer);", "AutoService.this.lambda$play$0(mediaPlayer);")
          s = s.replace("this.f$0.lambda$play$1(mediaPlayer, i, i2);", "AutoService.this.lambda$play$1(mediaPlayer, i, i2);")
          p.write_text(s)
          PY
          cat > project/app/src/main/java/com/carscreens/app/MapsCarAppService.java <<'EOF'
          package com.carscreens.app;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import androidx.car.app.CarAppService;
          import androidx.car.app.CarContext;
          import androidx.car.app.Screen;
          import androidx.car.app.Session;
          import androidx.car.app.model.Action;
          import androidx.car.app.model.ItemList;
          import androidx.car.app.model.ListTemplate;
          import androidx.car.app.model.Row;
          import androidx.car.app.model.Template;
          import androidx.car.app.validation.HostValidator;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MapsCarAppService extends CarAppService {
              static class MapsSession extends Session {
                  @Override public Screen onCreateScreen(Intent intent) {
                      return new MapsScreen(getCarContext());
                  }
              }

              @Override public Session onCreateSession() {
                  return new MapsSession();
              }

              static class MapsScreen extends Screen {
                  MapsScreen(CarContext context) { super(context); }

                  @Override public Template onGetTemplate() {
                      ItemList.Builder list = new ItemList.Builder();
                      SharedPreferences prefs = getCarContext().getSharedPreferences("ameer_maps", 0);
                      int count = 0;
                      try {
                          JSONArray apps = new JSONArray(prefs.getString("apps", "[]"));
                          for (int i = 0; i < apps.length(); i++) {
                              JSONObject app = apps.optJSONObject(i);
                              if (app == null) continue;
                              String name = app.optString("n", "خرائط");
                              String packageName = app.optString("p", "");
                              if (packageName.isEmpty()) continue;
                              list.addItem(new Row.Builder()
                                  .setTitle(name)
                                  .addText("اضغط لفتح تطبيق الملاحة المختار")
                                  .setOnClickListener(() -> openMap(packageName))
                                  .build());
                              count++;
                          }
                      } catch (Exception ignored) { }
                      if (count == 0) {
                          list.addItem(new Row.Builder()
                              .setTitle("ماكو تطبيقات خرائط مضافة")
                              .addText("أضف تطبيق الخرائط من قسم الخرائط في أمير على الهاتف")
                              .build());
                      }
                      return new ListTemplate.Builder()
                          .setSingleList(list.build())
                          .setTitle("خرائط أمير")
                          .setHeaderAction(Action.APP_ICON)
                          .build();
                  }

                  private void openMap(String packageName) {
                      Intent launch = getCarContext().getPackageManager().getLaunchIntentForPackage(packageName);
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getCarContext().startCarApp(launch);
                      } else {
                          getCarContext().startCarApp(new Intent(CarContext.ACTION_NAVIGATE, Uri.parse("geo:0,0")));
                      }
                  }
              }

              @Override public HostValidator createHostValidator() {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }
          }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeerScreens"
          include(":app")
          EOF
          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carscreens.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carscreens.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          dependencies {
              implementation 'androidx.car.app:app:1.4.0'
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.guava:guava:33.0.0-android'
          }
          EOF
          echo "APK SHA-256:" > project/REBUILD-NOTES.txt
          cat decoded/output/apk-sha256.txt >> project/REBUILD-NOTES.txt
          echo "Reconstructed from JADX output. This is a rebuild baseline, not yet the Android Auto UI modification." >> project/REBUILD-NOTES.txt

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload reconstructed project and APK
        uses: actions/upload-artifact@v4
        with:
          name: ameer-reconstructed-baseline
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/REBUILD-NOTES.txt
          if-no-files-found: error
          retention-days: 14
