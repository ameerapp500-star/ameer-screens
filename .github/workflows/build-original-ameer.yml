name: Build original Ameer Screens APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CarScreens-latest.zip'
      - 'patches/**'
      - '.github/workflows/build-original-ameer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract original project and apply updates
        run: |
          rm -rf app codegen
          unzip -q CarScreens-latest.zip -d .
          cp patches/AutoService.java app/src/main/java/com/carscreens/app/AutoService.java
          cp patches/AmeerCarAppService.java app/src/main/java/com/carscreens/app/AmeerCarAppService.java
          cp patches/AmeerHomeScreen.java app/src/main/java/com/carscreens/app/AmeerHomeScreen.java
          cp patches/AmeerMediaListScreen.java app/src/main/java/com/carscreens/app/AmeerMediaListScreen.java
          cp patches/AmeerNowPlayingScreen.java app/src/main/java/com/carscreens/app/AmeerNowPlayingScreen.java
          python3 - <<'PY'
          from pathlib import Path

          # Declare the permissions required by the original app's radio and
          # local-audio features. READ_EXTERNAL_STORAGE is legacy-only.
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          marker = '<application'
          if marker not in xml:
              raise SystemExit('AndroidManifest.xml has no <application> element')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.READ_MEDIA_AUDIO',
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in xml:
                  xml = xml.replace(marker, tag + '\n    ' + marker, 1)
          legacy = 'android.permission.READ_EXTERNAL_STORAGE'
          if legacy not in xml:
              tag = '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
              xml = xml.replace(marker, tag + '\n    ' + marker, 1)
          manifest.write_text(xml)

          # Add AndroidX Car App Library support for the native Android Auto media UI.
          gradle_file = Path('app/build.gradle')
          gradle_text = gradle_file.read_text()
          gradle_text = gradle_text.replace('compileSdk 34', 'compileSdk 35')
          if 'androidx.car.app:app:' not in gradle_text:
              gradle_text += "\\ndependencies {\\n  implementation 'androidx.car.app:app:1.8.0-rc01'\\n  implementation 'androidx.media:media:1.7.0'\\n}\\n"
          gradle_file.write_text(gradle_text)

          # Declare the templated media car app while retaining the original media service.
          manifest = Path('app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'androidx.car.app.MEDIA_TEMPLATES' not in xml:
              xml = xml.replace('<application', '<uses-permission android:name="androidx.car.app.MEDIA_TEMPLATES" />\\n  <application', 1)
          if 'android:name=".AmeerCarAppService"' not in xml:
              service = '''<service android:name=".AmeerCarAppService" android:exported="true" android:label="أمير للشاشات">
                  <intent-filter>
                      <action android:name="androidx.car.app.CarAppService" />
                      <category android:name="androidx.car.app.category.MEDIA" />
                  </intent-filter>
              </service>'''
              xml = xml.replace('</application>', service + '\\n  <meta-data android:name="androidx.car.app.minCarApiLevel" android:value="8" />\\n</application>', 1)
          manifest.write_text(xml)

          desc = Path('app/src/main/res/xml/automotive_app_desc.xml')
          desc_text = desc.read_text()
          if '<uses name="template"/>' not in desc_text:
              desc_text = desc_text.replace('<uses name="media"/>', '<uses name="media"/><uses name="template"/>')
          desc.write_text(desc_text)

          # Ask the user for local audio access on first launch.
          p = Path('app/src/main/java/com/carscreens/app/MainActivity.java')
          s = p.read_text()
          old = '    super.onCreate(b);'
          new = '''    super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 33) {
                if (checkSelfPermission(Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED)
                  requestPermissions(new String[]{Manifest.permission.READ_MEDIA_AUDIO}, 77);
              } else if (Build.VERSION.SDK_INT >= 23) {
                if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED)
                  requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 77);
              }'''
          if old not in s:
              raise SystemExit('Could not locate MainActivity.onCreate insertion point')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AmeerScreensOriginal'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          // Root project; Android Gradle Plugin is declared in app/build.gradle.
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/carscreens/app/MainActivity.java
          test -f app/src/main/java/com/carscreens/app/AutoService.java
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_AUDIO' app/src/main/AndroidManifest.xml

      - name: Package original source for car UI development
        run: |
          zip -qr /tmp/ameer-original-source.zip app/src/main app/build.gradle
      - name: Upload original source inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: ameer-original-source-inspection
          path: /tmp/ameer-original-source.zip
          if-no-files-found: error

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build original debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ameer-screens-car-media-v3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
